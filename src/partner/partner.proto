syntax = "proto3";

package partner;

// Third-party facing gRPC surface — see docs/partner-api-guide.md for the full integration
// guide and docs/adr/0003-partner-api-keys-scope-by-ward.md for why access is scoped by
// ward (not per-serial). Admin key issuance stays REST (/admin/partner-keys), unrelated to
// this contract.
service PartnerService {
  // Device metadata + trailing 1 hour of telemetry, always — no arbitrary date range.
  rpc GetDeviceSnapshot(GetDeviceSnapshotRequest) returns (GetDeviceSnapshotResponse);

  // Every device in `ward` (that the caller's key is scoped to) plus each device's single
  // latest telemetry reading — not the full history.
  rpc ListDevicesByWard(ListDevicesByWardRequest) returns (ListDevicesByWardResponse);

  // Downsampled telemetry for the last 1 / 7 / 30 days (avg/min/max per time bucket, per
  // probe) — not raw rows. Raw points are only available via GetDeviceSnapshot (last 1h).
  rpc GetDeviceHistory(GetDeviceHistoryRequest) returns (GetDeviceHistoryResponse);

  // Raw telemetry rows for the last 1 / 7 / 30 days, newest first, paginated — meant for
  // table views (GetDeviceHistory is the downsampled variant meant for charts).
  rpc ListDeviceTelemetry(ListDeviceTelemetryRequest) returns (ListDeviceTelemetryResponse);
}

message GetDeviceSnapshotRequest {
  string serial = 1;
}

message DeviceMetadata {
  string serial = 1;
  string name = 2;
  bool status = 3;
  string firmware = 4;
  bool online = 5;
}

message TelemetryPoint {
  string send_time = 1; // ISO 8601 UTC
  double temp = 2;
  double temp_display = 3;
  double humidity = 4;
  double humidity_display = 5;
  double temp_internal = 6;
  int32 battery = 7;
  bool plug = 8;
  bool door1 = 9;
  bool door2 = 10;
  bool door3 = 11;
  bool internet = 12;
  bool ext_memory = 13;
  string probe = 14;
}

message GetDeviceSnapshotResponse {
  DeviceMetadata device = 1;
  repeated TelemetryPoint timeseries = 2; // last 1h, newest first
}

message ListDevicesByWardRequest {
  string ward = 1;
  int32 page = 2;  // optional, default 1
  int32 limit = 3; // optional, default 20, max 100
}

message DeviceWithLatestReading {
  DeviceMetadata device = 1;
  optional TelemetryPoint latest = 2; // unset if the device has no telemetry yet
}

message ListDevicesByWardResponse {
  repeated DeviceWithLatestReading devices = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

enum HistoryRange {
  HISTORY_RANGE_UNSPECIFIED = 0; // rejected with INVALID_ARGUMENT
  DAY_1 = 1;  // bucket = 15 minutes
  DAY_7 = 2;  // bucket = 1 hour
  DAY_30 = 3; // bucket = 3 hours
}

message GetDeviceHistoryRequest {
  string serial = 1;
  HistoryRange range = 2;
}

message HistoryBucket {
  string bucket_start = 1; // ISO 8601 UTC, start of the bucket
  string probe = 2;        // raw channel id — buckets are per probe
  double temp_avg = 3;
  double temp_min = 4;
  double temp_max = 5;
  double humidity_avg = 6;
  double humidity_min = 7;
  double humidity_max = 8;
  int32 battery_min = 9;
  bool door_open = 10;     // any of door1/2/3 was open at some point in the bucket
  int32 samples = 11;
}

message GetDeviceHistoryResponse {
  DeviceMetadata device = 1;
  HistoryRange range = 2;
  string bucket_interval = 3;         // e.g. "15 minutes"
  repeated HistoryBucket buckets = 4; // oldest -> newest
}

message ListDeviceTelemetryRequest {
  string serial = 1;
  HistoryRange range = 2;
  int32 page = 3;  // optional, default 1
  int32 limit = 4; // optional, default 50, max 200
}

message ListDeviceTelemetryResponse {
  DeviceMetadata device = 1;
  HistoryRange range = 2;
  repeated TelemetryPoint points = 3; // newest first
  int32 total = 4;
  int32 page = 5;
  int32 limit = 6;
}
