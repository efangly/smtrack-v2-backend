# Tempo แบบ single-binary + S3 (MinIO) storage — ตัวแปรด้านล่างถูก expand จาก env ตอน start
# ด้วย flag -config.expand-env=true (ดู docker-compose.observability.yml)
# หมายเหตุ: ห้ามเขียนสัญลักษณ์ดอลลาร์ลอย ๆ ในไฟล์นี้ (รวมถึงใน comment) เพราะตัว
# expand-env parse ทั้งไฟล์แบบ strict ขึ้นต้นด้วยดอลลาร์ผิด syntax = crash ทั้งไฟล์
# top-level key (ห้ามย้ายเข้าไปใต้ server: — ไม่ใช่ field ของ server.Config, ทำแบบนั้นแล้ว Tempo crash-loop มาแล้ว)
# เปิด gRPC-over-HTTP streaming ให้ Grafana ทำ TraceQL search แบบ list ได้ผ่าน HTTP port เดียวกัน (3200) โดยไม่ต้องเปิด gRPC port แยก
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # flush ไวหน่อยจะได้เห็น trace ใน UI โดยไม่ต้องรอนาน
  max_block_duration: 1m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: s3
    # WAL เป็น local disk เสมอ (ก่อน flush ขึ้น object storage) ไม่ใช่ของที่ต้อง persist ระยะยาว
    wal:
      path: /var/tempo/wal
    s3:
      # quote ทุกตัว — ค่า secret อาจขึ้นต้นด้วยอักขระที่ YAML สงวนไว้ (@, `) ถ้าไม่ quote จะ parse error
      bucket: "${TEMPO_S3_BUCKET}"
      endpoint: "${MINIO_ENDPOINT}"
      access_key: "${ARCHIVE_S3_ACCESS_KEY}"
      secret_key: "${ARCHIVE_S3_SECRET_KEY}"
      region: "${ARCHIVE_S3_REGION}"
      forcepathstyle: true
      insecure: true

# สร้าง service graph + span metrics ให้ Grafana ใช้ต่อได้
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
