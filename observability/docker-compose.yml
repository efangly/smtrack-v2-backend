# Observability stack เดี่ยว ๆ สำหรับ dev server ที่มี mosquitto/minio/app รันอยู่แล้ว
# (compose อื่น บน network `proxy`) — ไฟล์นี้ไม่สร้าง mosquitto/minio ใหม่ ต่อเข้ากับของเดิมผ่าน
# external network เท่านั้น
#
#   cp observability/.env.example observability/.env   # แก้ค่าจริงก่อน deploy
#   bash observability/deploy.sh
#
# ใช้ config เดิมทั้งหมดจาก docker/{otel-collector,tempo,loki,prometheus,alloy,grafana}
# (อ้างอิงกันด้วยชื่อ container ตรง ๆ เช่น http://tempo:4318 — ทำงานได้เพราะทุก service
# อยู่บน network เดียวกับ mosquitto/minio/app)
#
# ไฟล์นี้ยังถูก include เข้า ../docker-compose.yml (full local dev stack) ด้วยผ่าน top-level
# `include:` — ตอน include เข้าไป docker-compose.yml หลักจะ override `networks.default`
# (ตัด external:true ออก ให้ compose สร้าง network ของ project เอง) และ override env ของ
# grafana/alertmanager ให้เหมาะกับ local dev (anonymous grafana, ไม่บังคับ Telegram token)

name: otel

networks:
  default:
    name: ${EXTERNAL_NETWORK:-proxy}
    external: true

# credential ของ MinIO ที่มีอยู่แล้วบน dev server — reuse ตัวเดียวกับที่ app ใช้ export
# archive (ARCHIVE_S3_ACCESS_KEY/SECRET_KEY) เพราะเป็น MinIO instance เดียวกัน
x-minio-env: &minio-env
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  ARCHIVE_S3_ACCESS_KEY: ${ARCHIVE_S3_ACCESS_KEY}
  ARCHIVE_S3_SECRET_KEY: ${ARCHIVE_S3_SECRET_KEY}
  ARCHIVE_S3_REGION: ${ARCHIVE_S3_REGION:-us-east-1}

services:
  # job แบบ one-shot: สร้าง bucket ของ tempo/loki บน MinIO เดิมให้พร้อมก่อน tempo/loki จะ start
  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      <<: *minio-env
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET:-tempo-traces}
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:-loki-chunks}
    entrypoint: >
      sh -c "mc alias set local http://$$MINIO_ENDPOINT $$ARCHIVE_S3_ACCESS_KEY $$ARCHIVE_S3_SECRET_KEY &&
             mc mb --ignore-existing local/$$TEMPO_S3_BUCKET &&
             mc mb --ignore-existing local/$$LOKI_S3_BUCKET"
    restart: 'no'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo, prometheus]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.1
    # expand-env=true ให้ ${...} ใน tempo.yaml ถูกแทนที่ด้วย env ด้านล่างตอน start
    command: ['-config.file=/etc/tempo/tempo.yaml', '-config.expand-env=true']
    user: root
    environment:
      <<: *minio-env
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET:-tempo-traces}
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    # expand-env=true ให้ ${...} ใน loki.yaml ถูกแทนที่ด้วย env ด้านล่างตอน start
    command: ['-config.file=/etc/loki/loki.yaml', '-config.expand-env=true']
    user: root
    environment:
      <<: *minio-env
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:-loki-chunks}
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # รับ metric แบบ OTLP push จาก Collector (แอปไม่ได้เปิด /metrics ให้ scrape)
      - '--web.enable-otlp-receiver'
      # Tempo metrics-generator ยิง service graph เข้ามาทาง remote write
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
      # ให้ reload rule files ด้วย POST /-/reload ได้โดยไม่ต้อง restart container
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on: [alertmanager]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    # Alertmanager ไม่มี native env-var expansion ในตัว (ไม่มี flag --config.expand-env จริง
    # ต่างจาก Tempo/Loki) — render ${...} ด้วย awk ก่อน exec ตัวจริงทุกครั้งที่ container start
    entrypoint: ['sh', '-c']
    command:
      - |
        awk '{
          gsub(/\$\{TELEGRAM_BOT_TOKEN\}/, ENVIRON["TELEGRAM_BOT_TOKEN"]);
          gsub(/\$\{TELEGRAM_CHAT_ID\}/, ENVIRON["TELEGRAM_CHAT_ID"]);
          print
        }' /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      # ไม่ใช้ `:?` required เพราะไฟล์นี้ถูก include เข้า full local dev stack ด้วย (ซึ่งไม่ตั้ง
      # Telegram token) — ตอน deploy จริงแบบ standalone ต้องตั้งค่าใน observability/.env เอง
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # อ่าน log ของ container ตัวอื่น (รวมถึง app ที่อยู่คนละ compose) ผ่าน Docker API
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      # เครื่องนี้เข้าถึงได้จากภายนอก — ปิด anonymous admin ต่างจาก local stack
      # ไม่ใช้ `:?` required เพราะไฟล์นี้ถูก include เข้า full local dev stack ด้วย — ตอน deploy
      # จริงแบบ standalone ต้องตั้ง GF_SECURITY_ADMIN_PASSWORD ใน observability/.env เอง
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    # 192.168.0.207 เป็น private LAN ไม่ใช่ internet-facing จึงเปิดรับได้ทุก interface
    # (auth ยังคงเปิดอยู่ — ปิด anonymous admin, ต้อง login ด้วย GF_SECURITY_ADMIN_PASSWORD เสมอ)
    ports: ['3001:3000']
    depends_on: [tempo, loki, prometheus]
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  alloy-data:
