# สภาพแวดล้อมทดสอบเต็มรูปแบบ: app + dependencies + observability stack ครบชุด
#
#   docker compose up -d --build
#   Grafana → http://localhost:3001   (app อยู่ที่ 3000 จึงเลี่ยงมาใช้ 3001)
#
# ทุกอย่างเป็น local ทั้งหมด ไม่แตะ server/ข้อมูลจริงตาม .env

name: smtrack

x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/smtrack
  MQTT_BROKER_URL: mqtt://mosquitto:1883
  MQTT_CLIENT_ID: nestjs-iot-service
  MQTT_LOG_TOPIC: devices/+/log
  MQTT_NOTIFICATION_TOPIC_PREFIX: notification
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  JWT_SECRET: local-dev-secret-not-for-production
  ARCHIVE_RETENTION_MONTHS: '6'
  # archive object storage → MinIO ในเครือข่าย compose (S3-compatible)
  # forcePathStyle จำเป็นกับ MinIO เพราะไม่มี virtual-host style bucket
  ARCHIVE_S3_ENDPOINT: http://minio:9000
  ARCHIVE_S3_ACCESS_KEY: minioadmin
  ARCHIVE_S3_SECRET_KEY: minioadmin
  ARCHIVE_S3_BUCKET: smtrack-log-archive
  ARCHIVE_S3_FORCE_PATH_STYLE: 'true'
  ARCHIVE_S3_REGION: us-east-1
  PORT: '3000'
  NODE_ENV: production
  LOG_LEVEL: debug
  OTEL_SERVICE_NAME: smtrack-backend
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  # ── dependencies ────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smtrack
    ports: ['5432:5432']
    volumes: ['timescale-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smtrack']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ['5672:5672', '15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 15

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ['1883:1883']
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mosquitto_sub -h localhost -t healthcheck -E -W 2 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # 9000 = S3 API, 9001 = web console
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # job แบบ one-shot: สร้าง bucket ให้พร้อมก่อน app จะ start
  # (ArchiveExportService ไม่ได้สร้าง bucket ให้เอง — upload จะพังถ้าไม่มี)
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/smtrack-log-archive"
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  # ── app ─────────────────────────────────────────────────────────────────────
  # job แบบ one-shot: รัน migration ให้เสร็จก่อน app จะ start
  migrate:
    build:
      context: .
      target: migrate
    environment: *app-env
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    environment: *app-env
    ports: ['3000:3000']
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
      otel-collector: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── observability ───────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4318:4318' # OTLP HTTP
      - '4317:4317' # OTLP gRPC
    depends_on: [tempo, prometheus]

  tempo:
    image: grafana/tempo:2.7.1
    command: ['-config.file=/etc/tempo/tempo.yaml']
    user: root
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ['3200:3200']

  loki:
    image: grafana/loki:3.4.2
    command: ['-config.file=/etc/loki/loki.yaml']
    user: root
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports: ['3100:3100']

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # รับ metric แบบ OTLP push จาก Collector (แอปไม่ได้เปิด /metrics ให้ scrape)
      - '--web.enable-otlp-receiver'
      # Tempo metrics-generator ยิง service graph เข้ามาทาง remote write
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ['9090:9090']

  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # อ่าน log ของ container ตัวอื่นผ่าน Docker API
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports: ['12345:12345']
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    # 3000 ชนกับ app จึง map ออกมาเป็น 3001
    ports: ['3001:3000']
    depends_on: [tempo, loki, prometheus]

volumes:
  timescale-data:
  minio-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
  alloy-data:
