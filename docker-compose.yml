# สภาพแวดล้อมทดสอบเต็มรูปแบบ: app + dependencies + observability stack ครบชุด
#
#   docker compose up -d --build
#   Grafana → http://localhost:3001   (app อยู่ที่ 3000 จึงเลี่ยงมาใช้ 3001)
#
# ทุกอย่างเป็น local ทั้งหมด ไม่แตะ server/ข้อมูลจริงตาม .env

name: smtrack

# Observability stack (otel-collector/tempo/loki/prometheus/alertmanager/alloy/grafana) ไม่ได้
# ฝังอยู่ในไฟล์นี้โดยตรง — ดึงมาจาก observability/docker-compose.yml ผ่าน `include:` เพื่อไม่ให้
# service definition ซ้ำสองที่กับ standalone attach mode (observability/deploy.sh)
# ดู override ของ networks/grafana/alertmanager ท้ายไฟล์นี้ที่จำเป็นสำหรับ full local dev
include:
  - observability/docker-compose.yml

x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/smtrack
  MQTT_BROKER_URL: mqtt://mosquitto:1883
  MQTT_CLIENT_ID: nestjs-iot-service
  MQTT_LOG_TOPIC: devices/+/log
  MQTT_NOTIFICATION_TOPIC_PREFIX: notification
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  JWT_SECRET: local-dev-secret-not-for-production
  DEVICE_SECRET: local-dev-device-secret-not-for-production
  ARCHIVE_RETENTION_MONTHS: '6'
  # archive object storage → MinIO ในเครือข่าย compose (S3-compatible)
  # forcePathStyle จำเป็นกับ MinIO เพราะไม่มี virtual-host style bucket
  ARCHIVE_S3_ENDPOINT: http://minio:9000
  ARCHIVE_S3_ACCESS_KEY: minioadmin
  ARCHIVE_S3_SECRET_KEY: minioadmin
  ARCHIVE_S3_BUCKET: smtrack-log-archive
  ARCHIVE_S3_FORCE_PATH_STYLE: 'true'
  ARCHIVE_S3_REGION: us-east-1
  PORT: '3000'
  NODE_ENV: production
  LOG_LEVEL: debug
  OTEL_SERVICE_NAME: smtrack-backend
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

# credential ของ MinIO ในเครือข่าย compose นี้ — reuse ตัวเดียวกับที่ app ใช้ export archive
# (ARCHIVE_S3_ACCESS_KEY/SECRET_KEY ใน x-app-env) เพราะเป็น MinIO instance เดียวกัน — tempo/loki ต้องใช้ด้วย
x-minio-env: &minio-env
  MINIO_ENDPOINT: minio:9000
  ARCHIVE_S3_ACCESS_KEY: minioadmin
  ARCHIVE_S3_SECRET_KEY: minioadmin
  ARCHIVE_S3_REGION: us-east-1

services:
  # ── dependencies ────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smtrack
    ports: ['5432:5432']
    volumes: ['timescale-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smtrack']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ['5672:5672', '15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 15

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ['1883:1883']
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mosquitto_sub -h localhost -t healthcheck -E -W 2 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # 9000 = S3 API, 9001 = web console
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # job แบบ one-shot: สร้าง bucket ให้พร้อมก่อน app จะ start
  # (ArchiveExportService ไม่ได้สร้าง bucket ให้เอง — upload จะพังถ้าไม่มี)
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/smtrack-log-archive &&
             mc mb --ignore-existing local/tempo-traces &&
             mc mb --ignore-existing local/loki-chunks"
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  # ── app ─────────────────────────────────────────────────────────────────────
  # job แบบ one-shot: รัน migration ให้เสร็จก่อน app จะ start
  migrate:
    build:
      context: .
      target: migrate
    environment: *app-env
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    environment: *app-env
    ports: ['3000:3000']
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
      otel-collector: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/log/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── observability (service definition มาจาก observability/docker-compose.yml ผ่าน include:) ──
  # override port publish + env ให้เหมาะกับ full local dev stack (anonymous grafana, ไม่ต้องตั้ง
  # Telegram token) — ตัว service เองมาจาก included file ทั้งหมด ไม่ประกาศซ้ำ
  otel-collector:
    ports:
      - '4318:4318' # OTLP HTTP
      - '4317:4317' # OTLP gRPC

  tempo:
    ports: ['3200:3200']

  loki:
    ports: ['3100:3100']

  prometheus:
    ports: ['9090:9090']

  alertmanager:
    ports: ['9093:9093']

  alloy:
    ports: ['12345:12345']

  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    # 3000 ชนกับ app จึง map ออกมาเป็น 3001
    ports: ['3001:3000']

# network ของ observability/docker-compose.yml (included file) ตั้งเป็น external:true ชี้ network
# `proxy` (ไว้ใช้ตอน deploy แบบ standalone attach เข้า dev server จริง) — full local stack นี้ต้อง
# override ทับให้ compose สร้าง network ของ project เอง (ไม่ external) มิเช่นนั้น `docker compose up`
# จะ error ว่าหา network `proxy` ไม่เจอ
networks:
  default:
    name: smtrack_default
    external: false

volumes:
  timescale-data:
  minio-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  alloy-data:
