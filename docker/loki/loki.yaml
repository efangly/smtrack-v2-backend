# Loki single-binary + S3 (MinIO) storage — ตัวแปรด้านล่างถูก expand จาก env ตอน start
# ด้วย flag -config.expand-env=true (ดู docker-compose.observability.yml)
# หมายเหตุ: ห้ามเขียนสัญลักษณ์ดอลลาร์ลอย ๆ ในไฟล์นี้ (รวมถึงใน comment) เพราะตัว
# expand-env parse ทั้งไฟล์แบบ strict ขึ้นต้นด้วยดอลลาร์ผิด syntax = crash ทั้งไฟล์
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    s3:
      # quote ทุกตัว — ค่า secret อาจขึ้นต้นด้วยอักขระที่ YAML สงวนไว้ (@, `) ถ้าไม่ quote จะ parse error
      bucketnames: "${LOKI_S3_BUCKET}"
      endpoint: "${MINIO_ENDPOINT}"
      access_key_id: "${ARCHIVE_S3_ACCESS_KEY}"
      secret_access_key: "${ARCHIVE_S3_SECRET_KEY}"
      region: "${ARCHIVE_S3_REGION}"
      s3forcepathstyle: true
      insecure: true
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # จำเป็นสำหรับ structured metadata ที่ Alloy ส่ง trace_id เข้ามา
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

analytics:
  reporting_enabled: false
